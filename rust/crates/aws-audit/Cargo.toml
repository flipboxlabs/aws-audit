[package]
name = "aws-audit"
version = "0.1.0"
description = "Core of the aws-audit Lambdas: audit types, config, storage, events and the audit service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-dynamodb = "1.139.0"
aws-sdk-eventbridge = "1.129.0"
base64.workspace = true
chrono.workspace = true
lambda-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
svix-ksuid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
aws-credential-types = "1.2.11"
aws-smithy-http-client = { version = "1.1.9", features = ["test-util"] }
aws-smithy-runtime-api = { version = "1.12.3", features = ["client"] }
aws-smithy-types = "1.4.3"
http = "1.5.0"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
