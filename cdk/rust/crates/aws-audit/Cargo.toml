[package]
name = "aws-audit"
version = "0.1.0"
description = "Core of the aws-audit Lambdas: audit types, config, storage, events and the audit service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-dynamodb.workspace = true
aws-sdk-eventbridge.workspace = true
aws-smithy-http-client = { version = "1.1.9", features = ["test-util"], optional = true }
aws-smithy-runtime-api = { version = "1.12.3", features = ["client"], optional = true }
aws-smithy-types = { version = "1.4.3", optional = true }
base64.workspace = true
chrono.workspace = true
http = { version = "1.5.0", optional = true }
lambda-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
svix-ksuid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
# Replaying contract/ fixtures through the SDK clients, for tests (`aws_audit::testing`)
testing = [
  "dep:aws-smithy-http-client",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:http",
]

[lints]
workspace = true

[dev-dependencies]
aws-audit = { path = ".", features = ["testing"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
