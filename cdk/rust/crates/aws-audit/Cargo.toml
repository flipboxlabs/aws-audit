[package]
name = "aws-audit"
version = "0.1.0"
description = "Audit logging for Rust Lambdas, and the core of the aws-audit Lambdas: audit types, config, storage, events and the audit service"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-sdk-eventbridge = { workspace = true, optional = true }
aws_lambda_events = { workspace = true, features = ["sqs"], optional = true }
aws-smithy-http-client = { version = "1.1.9", features = ["test-util"], optional = true }
aws-smithy-runtime-api = { version = "1.12.3", features = ["client"], optional = true }
aws-smithy-types = { version = "1.4.3", optional = true }
base64 = { workspace = true, optional = true }
chrono.workspace = true
futures-util = { workspace = true, optional = true }
http = { version = "1.5.0", optional = true }
lambda-kit = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
svix-ksuid.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"], optional = true }
tracing = { workspace = true, optional = true }

[features]
# Audit logging only (`Audits`, `LogAudit`): what an app needs to record audits
default = []
# Reading and writing the audit table and event bus (`AuditService`)
service = [
  "dep:aws-sdk-dynamodb",
  "dep:aws-sdk-eventbridge",
  "dep:base64",
  "dep:lambda-kit",
  "dep:tokio",
  "dep:tracing",
]
# Auditing SQS messages: retries, traces and batch processing (`aws_audit::sqs`)
sqs = ["dep:aws_lambda_events", "dep:futures-util"]
# Replaying contract/ fixtures through the SDK clients, for tests (`aws_audit::testing`)
testing = [
  "service",
  "dep:aws-smithy-http-client",
  "dep:aws-smithy-runtime-api",
  "dep:aws-smithy-types",
  "dep:http",
]

[lints]
workspace = true

[dev-dependencies]
aws-audit = { path = ".", features = ["testing", "sqs"] }
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
