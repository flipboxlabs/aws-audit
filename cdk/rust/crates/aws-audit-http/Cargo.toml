[package]
name = "aws-audit-http"
version = "0.1.0"
description = "What the aws-audit REST Lambdas share: pagination and config-driven validation, and audit errors as HTTP errors"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-audit.workspace = true
jsonschema = { version = "0.61", default-features = false, optional = true }
lambda-kit = { workspace = true, features = ["http"] }
lambda_http = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true

[features]
# Replaying contract/fixtures/http through a router, for tests (`aws_audit_http::testing`)
testing = ["aws-audit/testing", "dep:jsonschema", "dep:lambda_http", "dep:percent-encoding"]

[dev-dependencies]
aws-audit-http = { path = ".", features = ["testing"] }

[lints]
workspace = true
