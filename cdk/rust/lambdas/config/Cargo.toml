[package]
name = "config"
version = "0.1.0"
description = "The GET /config Lambda: the configured apps with their resource types, the statuses, and the package version"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-audit.workspace = true
indexmap.workspace = true
lambda-kit = { workspace = true, features = ["http"] }
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
aws-audit = { workspace = true, features = ["testing"] }
aws-audit-http = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
