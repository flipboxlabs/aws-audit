[package]
name = "subscription"
version = "0.1.0"
description = "The CloudWatch Logs subscription Lambda: stores the audits apps log"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-audit.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-eventbridge.workspace = true
aws_lambda_events = { workspace = true, features = ["cloudwatch_logs"] }
futures-util.workspace = true
lambda-kit.workspace = true
lambda_runtime.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
aws-audit = { workspace = true, features = ["testing"] }
base64.workspace = true
flate2 = "1"
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
