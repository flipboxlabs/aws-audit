[package]
name = "rerun"
version = "0.1.0"
description = "The POST /apps/{app}/objects/{object}/{item}/{audit}/rerun Lambda: sends an audit's recorded event again"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aws-audit.workspace = true
aws-audit-http.workspace = true
aws-config.workspace = true
aws-sdk-dynamodb.workspace = true
aws-sdk-eventbridge.workspace = true
lambda-kit = { workspace = true, features = ["http"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing.workspace = true

[dev-dependencies]
aws-audit = { workspace = true, features = ["testing"] }
aws-audit-http = { workspace = true, features = ["testing"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }

[lints]
workspace = true
