[workspace]
resolver = "3"
members = ["crates/*", "lambdas/*"]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
repository = "https://github.com/flipboxlabs/aws-audit"
publish = false

[workspace.dependencies]
aws-config = { version = "1.13", default-features = false, features = [
  "behavior-version-latest",
  "default-https-client",
  "rt-tokio",
] }
aws-sdk-dynamodb = "1.139.0"
aws-sdk-eventbridge = "1.129.0"
aws_lambda_events = { version = "1.2", default-features = false }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lambda_http = { version = "1.3", default-features = false, features = [
  "apigw_http",
  "apigw_rest",
  "tracing",
] }
lambda_runtime = "1.5"
percent-encoding = "2.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
svix-ksuid = "0.8"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }

aws-audit = { path = "crates/aws-audit", features = ["service"] }
aws-audit-http = { path = "crates/aws-audit-http" }
lambda-kit = { path = "crates/lambda-kit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
